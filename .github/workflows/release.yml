name: Release

on:
  push:
    tags: ["v*"]

# Only the final job can write. Branch/PR CI never calls this workflow.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      commit: ${{ steps.source.outputs.commit }}
      prerelease: ${{ steps.source.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate immutable release source
        id: source
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = tag
          core='(0|[1-9][0-9]*)'
          pre='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          meta='[0-9A-Za-z-]+'
          if [[ ! "$RELEASE_TAG" =~ ^v$core\.$core\.$core(-$pre(\.$pre)*)?(\+$meta(\.$meta)*)?$ ]]; then
            echo "Release tags must be v-prefixed SemVer." >&2
            exit 1
          fi
          if [[ "$RELEASE_TAG" == v0.1.2 || "$RELEASE_TAG" == v0.1.3 ]]; then
            echo "$RELEASE_TAG predates release packaging; it must not be replaced or backfilled." >&2
            exit 1
          fi
          commit="$(git rev-parse HEAD)"
          test "$(git rev-parse --verify "$GITHUB_REF^{commit}")" = "$commit"
          git merge-base --is-ancestor "$commit" refs/remotes/origin/main
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          version_without_build="${RELEASE_TAG%%+*}"
          prerelease=false
          if [[ "$version_without_build" == *-* ]]; then prerelease=true; fi
          printf 'tag=%s\ncommit=%s\nprerelease=%s\n' \
            "$RELEASE_TAG" "$commit" "$prerelease" >> "$GITHUB_OUTPUT"

  checks:
    needs: validate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  package:
    needs: [validate, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: true
      - name: Package the exact clean tag
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          set -euo pipefail
          go run ./cmd/csc-release --tag "$RELEASE_TAG" --out dist/release
          cd dist/release
          sha256sum --check --strict SHA256SUMS
          jq -r '.targets[] | .archive_sha256 + "  " + .archive' release.json |
            sha256sum --check --strict -
          smoke_dir="$(mktemp -d)"
          tar -xzf "cross-session-codex_${RELEASE_TAG}_linux_amd64.tar.gz" -C "$smoke_dir"
          "$smoke_dir/cross-session-codex" version | jq -e \
            --arg tag "$RELEASE_TAG" --arg commit "$RELEASE_COMMIT" \
            --slurpfile manifest release.json '
              .name == "cross-session-codex" and .version == $tag and
              .commit == $commit and .os == "linux" and .arch == "amd64" and
              .build_date == $manifest[0].build_date and .go == $manifest[0].go_version
            '
          "$smoke_dir/cross-session-codex" capabilities | jq -e --arg tag "$RELEASE_TAG" '
            .name == "cross-session-codex" and .version == $tag and .cli_api == 1 and
            (.features | index("launch-handshake-v1") != null)
          '
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-packages
          path: dist/release/*
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [validate, checks, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # No checkout, build commands, or execution of downloaded code in this job.
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-packages
          path: release-assets
      - name: Verify assets and create a new release
        shell: bash
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          set -euo pipefail
          test "$RELEASE_TAG" != v0.1.2
          test "$RELEASE_TAG" != v0.1.3
          assets=(
            "cross-session-codex_${RELEASE_TAG}_darwin_amd64.tar.gz"
            "cross-session-codex_${RELEASE_TAG}_darwin_arm64.tar.gz"
            "cross-session-codex_${RELEASE_TAG}_linux_amd64.tar.gz"
            "cross-session-codex_${RELEASE_TAG}_linux_arm64.tar.gz"
            release.json SHA256SUMS
          )
          expected="$(printf '%s\n' "${assets[@]}" | LC_ALL=C sort)"
          test "$(printf '%s\n' * | LC_ALL=C sort)" = "$expected"
          for asset in "${assets[@]}"; do test -f "$asset" && test ! -L "$asset"; done
          checksummed="$(printf '%s\n' "${assets[@]:0:5}" | LC_ALL=C sort)"
          test "$(cut -c67- SHA256SUMS | LC_ALL=C sort)" = "$checksummed"
          sha256sum --check --strict SHA256SUMS
          jq -e --arg tag "$RELEASE_TAG" --arg commit "$RELEASE_COMMIT" '
            .schema_version == 1 and .project == "cross-session-codex" and
            .version == $tag and .tag == $tag and .release == true and
            .source_commit == $commit and .source_dirty == false and
            ([.targets[] | .os + "/" + .arch] | sort) ==
              ["darwin/amd64", "darwin/arm64", "linux/amd64", "linux/arm64"] and
            all(.targets[]; .archive ==
              ("cross-session-codex_" + $tag + "_" + .os + "_" + .arch + ".tar.gz"))
          ' release.json
          jq -r '.targets[] | .archive_sha256 + "  " + .archive' release.json |
            sha256sum --check --strict -

          # Distinguish an absent release from API/network failure. Refuse even
          # a draft from an interrupted attempt; a human must inspect it first.
          existing="$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" |
            jq -s --arg tag "$RELEASE_TAG" '[.[][] | select(.tag_name == $tag)] | length')"
          if [[ "$existing" != 0 ]]; then
            echo "A release for $RELEASE_TAG already exists; refusing to alter it." >&2
            exit 1
          fi

          verify_tag() {
            local object kind sha depth
            object="$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG")"
            kind="$(jq -r .object.type <<< "$object")"
            sha="$(jq -r .object.sha <<< "$object")"
            # Peel annotated tags without trusting target_commitish (which can
            # be a mutable branch). Never create, move, or delete a Git tag.
            for ((depth = 0; depth < 8; depth++)); do
              if [[ "$kind" == commit ]]; then
                test "$sha" = "$RELEASE_COMMIT"
                return
              fi
              test "$kind" = tag
              object="$(gh api "repos/$GH_REPO/git/tags/$sha")"
              kind="$(jq -r .object.type <<< "$object")"
              sha="$(jq -r .object.sha <<< "$object")"
            done
            echo "Tag nesting exceeded validation limit." >&2
            return 1
          }
          verify_tag
          release_flags=()
          if [[ "$PRERELEASE" == true ]]; then
            release_flags+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag --draft \
            --target "$RELEASE_COMMIT" --title "$RELEASE_TAG" --generate-notes \
            "${release_flags[@]}"
          uploaded="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | LC_ALL=C sort)"
          test "$uploaded" = "$expected"
          verify_tag
          # Draft-first supports immutable releases; no --clobber or automatic
          # draft cleanup. Failed uploads remain visibly incomplete for review.
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$PRERELEASE"
